<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>연수 진행</title><link rel="stylesheet" href="../live.css"><script src="../live-client.js" defer></script></head><body data-live-role="host"><main><header><h1>연수 진행</h1><span id="live-status" role="status">서버 연결 필요</span></header><section id="entry"><label>참여 코드<input id="join-code" autocomplete="off" maxlength="12"></label><label>회차 진행자 키<input id="host-token" type="password" autocomplete="off"></label><button id="join" type="button">입장</button><details><summary>새 연수 회차 만들기</summary><p>로컬 서버를 시작한 터미널의 운영 키를 사용하세요. 공개 배포 전 HTTPS와 운영 환경을 구성해야 합니다.</p><label>서버 운영 키<input id="operator-key" type="password" autocomplete="off"></label><label>연수 이름<input id="run-title" value="공통 참여 블록 예제"></label><label>활동 구성(JSON)<textarea id="blocks-json" rows="12"></textarea></label><button id="create">회차 만들기</button></details></section><section id="workspace" hidden><h2 id="run-heading"></h2><p id="run-code"></p><nav id="block-nav" aria-label="참여 활동"></nav><h2 id="block-title"></h2><p id="closed-note"></p><div id="host-controls"></div><a id="join-url" target="_blank" rel="noopener">참가자 입장</a><form id="response-form"></form><p id="my-status" role="status"></p><section id="results" aria-label="활동 결과"></section><details><summary>기록·회차 관리</summary><p>종료하면 응답이 마감됩니다. 기본 보존 기간은 생성 후 14일입니다. 초기화하면 이 회차의 참여·응답·진행자 권한이 영구 삭제됩니다.</p><div class="tools"><button id="export-json">응답 JSON</button><button id="export-csv">응답 CSV</button><button id="end-run">회차 종료</button><button id="reset-run">회차 초기화</button></div></details><dialog id="reset-dialog"><h2>이 회차를 삭제할까요?</h2><p>응답과 참여 기록을 복원할 수 없습니다. 필요하면 먼저 내려받으세요.</p><button id="confirm-reset">삭제</button><form method="dialog"><button>취소</button></form></dialog></section></main></body></html>
